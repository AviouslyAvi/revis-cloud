<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Revis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212; color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .logo { font-size: 24px; font-weight: 700; margin-bottom: 32px; letter-spacing: -0.5px; }
    .logo span { color: #a78bfa; }
    #sign-up { min-width: 380px; }
  </style>
</head>
<body>
  <div class="logo"><span>R</span>evis</div>
  <div id="sign-up"></div>

  <script>
    async function initClerk() {
      const { publishableKey } = await fetch('/api/clerk-key').then(r => r.json());
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
      script.crossOrigin = 'anonymous';
      script.dataset.clerkPublishableKey = publishableKey;
      script.async = true;
      document.head.appendChild(script);
      await new Promise(resolve => {
        const check = setInterval(() => {
          if (window.Clerk && window.Clerk.loaded) { clearInterval(check); resolve(); }
        }, 100);
      });
      if (window.Clerk.user) {
        window.location.href = '/app';
        return;
      }
      window.Clerk.mountSignUp(document.getElementById('sign-up'), {
        routing: 'path',
        path: '/sign-up',
        signInUrl: '/sign-in',
        afterSignUpUrl: '/app',
      });
    }
    initClerk().catch(err => console.error('Clerk init failed:', err));
  </script>
</body>
</html>
